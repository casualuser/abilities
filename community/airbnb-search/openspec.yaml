openapi: 3.0.0
info:
  title: SearchAPI.io Airbnb Search API
  version: 1.0.0
  description: OpenAPI specification for the SearchAPI.io Airbnb endpoints used by the Ability.
servers:
  - url: https://www.searchapi.io/api/v1
paths:
  /search:
    get:
      summary: Search Airbnb listings or get properties/reviews.
      parameters:
        - name: engine
          in: query
          required: true
          schema:
            type: string
            enum: [airbnb, airbnb_property, airbnb_property_reviews]
        - name: api_key
          in: query
          required: true
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: property_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
